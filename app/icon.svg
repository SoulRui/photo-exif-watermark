<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MC Image 照片 EXIF 水印工具图标</title>
  <desc id="desc">MC Software Visual Identity System V1.0. Keep mc-brand-header unchanged and replace app-artwork for other applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="photo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="avatar-clip">
      <rect x="96" y="92" width="128" height="128" rx="28"/>
    </clipPath>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="208" fill="url(#background)"/>
  <circle cx="860" cy="850" r="300" fill="#FFFFFF" opacity="0.03"/>
  <g id="app-artwork">
    <ellipse cx="526" cy="828" rx="280" ry="40" fill="#020617" opacity="0.35" filter="url(#soft-shadow)"/>
    <rect x="272" y="384" width="496" height="368" rx="48" fill="#6D28D9"/>
    <rect x="296" y="404" width="448" height="12" rx="6" fill="#FFFFFF" opacity="0.16"/>
    <rect x="208" y="448" width="560" height="392" rx="48" fill="#F8FAFC"/>
    <rect x="232" y="472" width="512" height="256" rx="28" fill="url(#photo-sky)"/>
    <circle cx="656" cy="536" r="44" fill="#F8FAFC" opacity="0.88"/>
    <path d="M232 672 L360 552 L464 648 L560 584 L744 704 V704 Q744 728 720 728 H256 Q232 728 232 704 Z" fill="#7C3AED"/>
    <path d="M232 680 L344 600 L456 704 L520 656 L640 728 H256 Q232 728 232 704 Z" fill="#5B21B6" opacity="0.85"/>
    <rect x="248" y="760" width="12" height="48" rx="6" fill="#8B5CF6"/>
    <rect x="288" y="764" width="220" height="14" rx="7" fill="#A78BFA"/>
    <rect x="288" y="796" width="152" height="12" rx="6" fill="#C4B5FD"/>
    <circle cx="752" cy="772" r="88" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="8"/>
    <text x="752" y="780" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="700">T</text>
  </g>
  <g id="mc-brand-header">
    <path d="M240 32 H784 Q992 32 992 240 V282 H32 V240 Q32 32 240 32 Z" fill="#F8FAFC"/>
    <rect x="32" y="276" width="960" height="6" fill="#2563EB"/>
    <image href="creator-avatar.png" x="96" y="92" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
    <rect x="96" y="92" width="128" height="128" rx="28" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <text x="264" y="160" dominant-baseline="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="128" font-weight="700" letter-spacing="-5">MC</text>
    <line x1="496" y1="104" x2="496" y2="220" stroke="#CBD5E1" stroke-width="3"/>
    <text x="536" y="164" dominant-baseline="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="600">Image</text>
  </g>
  <rect x="34" y="34" width="956" height="956" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
</svg>
